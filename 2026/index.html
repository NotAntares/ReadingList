<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>TBR 2026</title>
</head>
<body>
    <header>
        <h1>My Library</h1>
        <button commandfor="add-dialog" command="show-modal">Add Book</button>
    </header>
    <main>
        <section class="library">
            <article class="shelf"></article>
            <div class="board"><h2>Finished</h2></div>
            <article class="pile"></article>
            <div class="board"><h2>Pile of Shame</h2></div>
        </section>
        <dialog id="add-dialog">
            <article>
                <p>To add a book, please fill out this form</p>
                <button commandfor="add-dialog" command="close">X</button>
            </article>
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title">
        
                    <label for="author">Author</label>
                    <input type="text" name="author" id="author">
        
                    <label for="pages">Page Count</label>
                    <input type="text" name="pages" id="pages">
                        
                    <label for="state">I've read this book</label>
                    <input type="checkbox" name="state" id="state">
                            
                    <button class="submit">Check</button>
        </dialog>
    </main>

    
</body>

<script src="scripts/javascript.js"></script>
</html>
